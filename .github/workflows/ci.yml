name: GitHub CI

# Pull requests are the gate; main only reports and warms caches.
#   • pull_request: pre-commit, C++ tests (oldest GCC and Clang, newest GCC,
#     which also runs clang-tidy), Python tests with coverage, ASan+UBSan.
#   • push to main: C++ tests and Python again (they save the ccache entries
#     every PR restores, and upload main's Python coverage), plus C++ coverage.
#   • workflow_dispatch: everything.
# Every job should finish within 10 minutes; the 12-minute timeouts are
# headroom, not budget. Linux only: macOS is checked by local development.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels a pull request's older run; every commit on main keeps
# its run (and its coverage upload).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # Tests run on one thread each; ctest runs them in parallel, one per core.
  # GNU `nproc` honours OMP_NUM_THREADS and would print 1 here, so every
  # --parallel/-j below uses `nproc --all`, which ignores it.
  OMP_NUM_THREADS: "1"

jobs:
  pre-commit:
    name: pre-commit
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  # Release build + ctest. The toolchain floor (CMakeLists.txt: GCC 11 on
  # Ubuntu 22.04 with its cmake 3.22; Clang 17) and the newest GCC, which
  # also builds the benchmarks and an installed-package consumer and, on pull
  # requests, runs clang-tidy over its compile database.
  cpp-tests:
    name: "C++ tests (${{ matrix.cc }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          # jammy's catch2 is 2.x, so this job builds the pinned Catch2 3.
          - { os: ubuntu-22.04, cc: gcc-11, cxx: g++-11, packages: "gcc-11 g++-11" }
          # Clang needs the libomp of its own version.
          - { os: ubuntu-24.04, cc: clang-17, cxx: clang++-17, packages: "clang-17 libomp-17-dev catch2" }
          - os: ubuntu-26.04
            cc: gcc-15
            cxx: g++-15
            packages: "gcc-15 g++-15 catch2 clang-tidy-22"
            cmake_args: "-DDMT_BUILD_BENCHMARKS=ON -DDMT_CPU_ARCH=x86-64-v3"
            consumer: true
            tidy: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          packages: python3-dev ${{ matrix.packages }}
          cache-key: cpp-tests-${{ matrix.cc }}-${{ matrix.os }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip "pybind11>=3.0"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake --preset ci
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -Dpybind11_DIR=$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset ci --parallel "$(nproc --all)"

      - name: Run C++ unit tests
        run: ctest --preset ci --parallel "$(nproc --all)"

      # The installed package must work for downstream find_package(dmt) users
      # (dmtConfig.cmake, dmt::dmt, the static FFTW/OpenMP chain).
      - name: Install and build a downstream consumer
        if: matrix.consumer
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --install build-ci --prefix "$RUNNER_TEMP/dmt"
          cmake -S tests/consumer -B build-consumer -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/dmt"
          cmake --build build-consumer
          ./build-consumer/dmt_consumer

      # dmt's own library and binding sources (not the CPM dependencies, not
      # the Catch2 tests: mostly macro noise). The path-sensitive
      # clang-analyzer-* checks stay local: they were ~80% of the run time.
      - name: clang-tidy
        if: matrix.tidy && github.event_name != 'push'
        run: |
          mapfile -t files < <(jq -r '.[].file' build-ci/compile_commands.json \
            | grep -E "^${GITHUB_WORKSPACE}/(lib|src)/" | sort -u | xargs ls -S \
            | sed 's/.*/^&$/')
          run-clang-tidy-22 -p build-ci -quiet -j "$(nproc --all)" \
            -checks='-clang-analyzer-*' "${files[@]}"

  # The supported user path (uv install + pytest), with coverage on every run.
  python-tests:
    name: Python (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          packages: libomp-dev
          cache-key: python-ubuntu-26.04
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install package and test dependencies
        run: uv sync --extra tests --reinstall-package dmtlib
        env:
          CMAKE_ARGS: >-
            -DDMT_GPU=OFF
            -DDMT_BUILD_TESTING=OFF
            -DDMT_ENABLE_NATIVE_ARCH=OFF
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Test with pytest
        run: uv run pytest --durations=15 --cov=dmtlib --cov-report=xml tests/python

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: ${{ github.event_name == 'push' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ASan + UBSan on the C++ tests (no Python bindings), Debug assertions at
  # -O2 (CMakePresets.json). Pull requests only. No ccache: main never runs
  # this job, so there is no entry for a PR to restore.
  sanitizers:
    name: Sanitizers (ASan+UBSan, gcc-15, -O2)
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          packages: gcc-15 g++-15 libomp-dev catch2
          cache-key: sanitizers-gcc-15
          ccache: "false"

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel "$(nproc --all)"

      - name: Run tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset asan --parallel "$(nproc --all)"

  # gcov (Debug, -O1) uploaded to Codecov. A report, not a gate: main only.
  cpp-coverage:
    name: C++ coverage (gcc-15)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          packages: gcc-15 g++-15 gcovr libomp-dev catch2
          cache-key: cpp-coverage-gcc-15

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: >
          cmake --preset coverage
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset coverage --parallel "$(nproc --all)"

      - name: Run C++ unit tests (instrumented)
        run: ctest --preset coverage --parallel "$(nproc --all)"

      - name: Generate coverage report
        run: |
          gcovr -r . --filter 'lib/.*' --filter 'include/.*' --filter 'src/.*' \
            --exclude 'tests/.*' --exclude 'build[^/]*/_deps/.*' --exclude 'bench/.*' \
            --gcov-executable gcov-15 \
            --cobertura coverage.xml

      - name: Upload C++ coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: cpp
          name: cpp-gcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
