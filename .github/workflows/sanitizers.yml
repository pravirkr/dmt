name: Sanitizers

# ASan + UBSan over the C++ tests, run by hand on a pull request's branch
# just before merging, so a memory or UB bug is fixed in that PR:
#   Actions → Sanitizers → Run workflow → pick the branch, or
#   gh workflow run sanitizers.yml --ref <branch>
# Never on main. -O1, the level ASan is designed for: -O2 can optimise away
# the bad access a test makes and inlines away stack frames. A cold build is
# ~6 minutes on a 4-core runner and the tests ~7-8 more, so this is the one
# job allowed 30 minutes.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  # One thread per test; ctest runs them in parallel, one per core
  # (`nproc --all`: plain `nproc` honours OMP_NUM_THREADS and prints 1).
  OMP_NUM_THREADS: "1"

jobs:
  # C++ tests only (no Python bindings), Debug assertions at -O1
  # (CMakePresets.json). No ccache: nothing on main saves an entry.
  sanitizers:
    name: Sanitizers (ASan+UBSan, gcc-15, -O1)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-cpp
        with:
          packages: gcc-15 g++-15 libomp-dev catch2
          cache-key: sanitizers-gcc-15
          ccache: "false"

      - name: Configure
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel "$(nproc --all)"

      - name: Run tests under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset asan --parallel "$(nproc --all)"
