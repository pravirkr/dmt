[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "dmtlib"
dynamic = ["version"]
description = "Dispersion Measure Transform Library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pravir Kumar", email = "pravirka@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy"]

[project.urls]
Github = "https://github.com/pravirkr/dmt"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-sugar",
    "pytest-benchmark",
    "mypy",
]
docs = ["sphinx", "sphinx-book-theme", "sphinx-click", "myst-nb", "breathe"]
develop = ["ruff"]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
install.strip = true            # Strip debug symbols
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
DMT_BUILD_PYTHON = "ON"
DMT_BUILD_TESTING = "OFF"
DMT_BUILD_DOCS = "OFF"
DMT_BUILD_BENCHMARKS = "OFF"
DMT_CUDA = "AUTO"
DMT_USE_SYSTEM_DEPS = "OFF"
DMT_ENABLE_NATIVE_ARCH = "ON"
DMT_ENABLE_COVERAGE = "OFF"
DMT_ENABLE_IPO = "OFF"
DMT_BUILT_AS_SHARED = "OFF"
CMAKE_BUILD_PARALLEL_LEVEL = "4"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\([^)]*VERSION\s+(?P<value>[0-9][^\s)]+)'

[tool.cibuildwheel]
test-extras = "test"
test-command = "python -m pytest {project}/tests/python -v"
test-skip = "pp* *-musllinux* *-manylinux_i686"

[tool.cibuildwheel.linux]
# Wheels must run on machines other than the builder — no -march=native, pinned CPM deps.
environment = { DMT_ENABLE_NATIVE_ARCH = "OFF", DMT_USE_SYSTEM_DEPS = "OFF", DMT_CUDA = "AUTO" }

[tool.cibuildwheel.macos]
environment = { DMT_ENABLE_NATIVE_ARCH = "OFF", DMT_USE_SYSTEM_DEPS = "OFF", DMT_CUDA = "OFF" }

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D1", "PLR2004"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src"]
exclude = ["tests/**"]

[tool.ty.rules]
index-out-of-bounds = "ignore"
unresolved-import = "ignore"
not-iterable = "ignore"        # For Numba prange

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests/python"]

[tool.coverage.run]
omit = ["tests/*", "*__init__.py", "docs/*"]

[tool.coverage.report]
show_missing = true
ignore_errors = true
#fail_under = 85
exclude_lines = ['raise AssertionError', 'raise NotImplementedError']

[tool.coverage.path]
source = "src/dmtlib"

[tool.gcovr]
filter = ["lib/*"]
